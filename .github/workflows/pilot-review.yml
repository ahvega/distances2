name: pilot-review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - run: >-
          echo "auto-approve desactivado: github-actions[bot] no puede aprobar
          PRs (ahvega/agent-skills#262). La aprobacion la da bertoadal
          (segunda cuenta del owner). Job en no-op para que el check quede
          verde y ws-control pueda evaluar ciGreen."
